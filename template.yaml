AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 30
    Runtime: python3.13
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref TodoTable
        MAX_TITLE_LENGTH: 200

Resources:
  TodoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-todos"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  TodoApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: lambda_function.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodoTable
      Events:
        GetTodos:
          Type: Api
          Properties:
            Path: /todos
            Method: get
        GetTodo:
          Type: Api
          Properties:
            Path: /todos/{id}
            Method: get
        CreateTodo:
          Type: Api
          Properties:
            Path: /todos
            Method: post
        UpdateTodo:
          Type: Api
          Properties:
            Path: /todos/{id}
            Method: put
        DeleteTodo:
          Type: Api
          Properties:
            Path: /todos/{id}
            Method: delete
        OptionsHandler:
          Type: Api
          Properties:
            Path: /todos
            Method: options
        OptionsHandlerWithId:
          Type: Api
          Properties:
            Path: /todos/{id}
            Method: options

Outputs:
  TodoApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/todos"
  TodoTableName:
    Description: "DynamoDB table name"
    Value: !Ref TodoTable
